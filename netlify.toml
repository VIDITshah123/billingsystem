[build]
  command = "npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Forward all /api requests to Netlify serverless Express function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Route everything else to React index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
